apiVersion: v1
kind: Namespace
metadata:
  name: openshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshop-config
  namespace: openshop
data:
  APP_NAME: openshop
  APP_ENV: production
  LOG_LEVEL: info
  APP_CURRENCY: CNY
  ORDER_TTL: 30m
  HTTP_ADDR: ":8080"
  HTTP_CORS_ORIGINS: "https://shop.example.com"
  HTTP_RATE_LIMIT_RPS: "200"
  REDIS_ADDR: redis:6379
  NATS_URL: nats://nats:4222
  JWT_ISSUER: openshop
  JWT_ACCESS_TTL: 2h
  JWT_REFRESH_TTL: 720h
  PAYMENT_PROVIDER: mock
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: openshop
  STORAGE_PUBLIC_URL: https://cdn.example.com
  MAIL_DRIVER: smtp
  WORKER_ENABLED: "true"
  OUTBOX_INTERVAL: 1s
  ORDER_SWEEP_INTERVAL: 1m
---
apiVersion: v1
kind: Secret
metadata:
  name: openshop-secrets
  namespace: openshop
type: Opaque
stringData:
  # Replace with real values (or use an external secret manager / sealed-secrets).
  JWT_SECRET: "change-me-in-production-please"
  POSTGRES_DSN: "host=postgres port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  MAIL_USER: ""
  MAIL_PASS: ""
