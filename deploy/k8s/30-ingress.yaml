# The storefront binary serves the public API and the embedded storefront SPA, so
# a single ingress rule routes everything to it. The admin console is a separate
# service (openshop-ops) and is intentionally not exposed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openshop
  namespace: openshop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openshop-backend
                port: { number: 8080 }
