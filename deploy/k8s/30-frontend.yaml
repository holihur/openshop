apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshop-frontend
  namespace: openshop
  labels: { app: openshop-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: openshop-frontend }
  template:
    metadata:
      labels: { app: openshop-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/holihur/openshop-frontend:latest
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: openshop-frontend
  namespace: openshop
spec:
  selector: { app: openshop-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openshop
  namespace: openshop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openshop-backend
                port: { number: 8080 }
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: openshop-backend
                port: { number: 8080 }
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: openshop-backend
                port: { number: 8080 }
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: openshop-backend
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openshop-frontend
                port: { number: 80 }
