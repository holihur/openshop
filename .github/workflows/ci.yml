name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
          POSTGRES_DB: openshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (unit + integration)
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  frontends:
    name: Frontends (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run lint

      # Component and page tests (vitest + Testing Library).
      - name: Component tests
        run: pnpm test

      - name: Build storefront and ops
        run: pnpm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Reachable-vulnerability scan of the standard library and dependencies.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Static analysis for common Go security mistakes.
      - name: gosec
        working-directory: backend
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Dependency advisories. Fails on high and critical only.
      - name: Dependency audit (npm)
        run: |
          pnpm audit --audit-level=high || {
            echo '::error::high or critical dependency advisory';
            pnpm audit || true;
            exit 1;
          }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      # The runner enables BuildKit but does not always ship the buildx plugin;
      # without it `docker build` fails immediately with "BuildKit is enabled
      # but the buildx component is missing". Installing buildx explicitly makes
      # the build deterministic.
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (API + embedded SPAs)
        run: |
          docker version
          docker build --progress=plain -f backend/Dockerfile -t openshop-backend:ci .
      - name: Verify the image contents
        run: |
          docker run --rm --entrypoint /bin/sh openshop-backend:ci \
            -c 'ls -l /app/server /app/ops /app/migrate /app/seed && ls /app/migrations | head -3'
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          image: openshop-backend:ci
          artifact-name: openshop-sbom.spdx.json
          output-file: openshop-sbom.spdx.json
      - name: Scan the image
        # trivy-action has no floating major tag, so pin an explicit release.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openshop-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      # The server-rendered storefront is a Node application, so it ships as its
      # own image and must be built and scanned like the API.
      - name: Build the SSR storefront image
        run: docker build --progress=plain -f front_ssr/Dockerfile -t openshop-front-ssr:ci .
      - name: Verify the SSR image serves HTML
        run: |
          docker run -d --name ssr --network host -e OPENSHOP_API_BASE=http://127.0.0.1:1 openshop-front-ssr:ci
          ready=""
          for i in $(seq 1 45); do
            sleep 2
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then ready=yes; break; fi
          done
          if [ -z "$ready" ]; then
            echo "::error::the SSR container never served a response"
            docker logs ssr || true
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' ssr || true
            exit 1
          fi
          # The API address is deliberately unreachable: the page must still
          # render, because failing to reach the API degrades content instead of
          # returning an error page.
          curl -fsS http://127.0.0.1:3000/ | grep -qi "<html"
          docker rm -f ssr
      - name: Scan the SSR image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openshop-front-ssr:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [frontends]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
          POSTGRES_DB: openshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DSN: host=localhost port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
      REDIS_ADDR: localhost:6379
      NATS_URL: nats://localhost:4222
      # The suite drives every browser from one IP, so the per-IP limiters would
      # throttle the tests rather than the app. They stay enforced in production.
      HTTP_RATE_LIMIT_RPS: "100000"
      HTTP_RATE_LIMIT_USER_RPS: "100000"
      HTTP_AUTH_RATE_LIMIT_RPS: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SPAs
        run: make fe-build
      - name: Start NATS (JetStream)
        run: docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -sd /data
      - name: Install Playwright browsers
        run: pnpm --filter @openshop/e2e exec playwright install --with-deps chromium firefox webkit
      - name: Run E2E
        run: pnpm --filter @openshop/e2e test

      # The server-rendered storefront is a separate app with its own suite.
      - name: Run E2E (SSR storefront)
        run: pnpm --filter @openshop/e2e test:ssr
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  loadtest:
    name: Load test (k6)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
          POSTGRES_DB: openshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DSN: host=localhost port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
      REDIS_ADDR: localhost:6379
      NATS_URL: nats://localhost:4222
      HTTP_ADDR: :8080
      WORKER_ENABLED: "false"
      # The load generator is a single IP; raise the limiter so it measures the
      # app rather than the rate limit (which is covered by unit tests).
      HTTP_RATE_LIMIT_RPS: "100000"
      HTTP_RATE_LIMIT_USER_RPS: "100000"
      HTTP_AUTH_RATE_LIMIT_RPS: "100000"
      BASE: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start NATS (JetStream)
        run: docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -sd /data
      - name: Migrate and seed
        working-directory: backend
        run: |
          go run ./cmd/migrate -dir migrations
          go run ./cmd/seed
      - name: Build and start the API
        working-directory: backend
        run: |
          go build -o /tmp/openshop ./cmd/server
          /tmp/openshop &
          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { echo "server did not become ready"; exit 1; }
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 (thresholds enforced)
        run: k6 run scripts/loadtest.js

  release-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
