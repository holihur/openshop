name: openshop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openshop
      POSTGRES_PASSWORD: openshop
      POSTGRES_DB: openshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshop -d openshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  migrate:
    build:
      context: ./backend
    command: ["/app/migrate", "-dir", "/app/migrations"]
    environment:
      POSTGRES_DSN: host=postgres port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
    command: ["/app/seed"]
    environment:
      POSTGRES_DSN: host=postgres port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["seed"]
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      HTTP_CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      POSTGRES_DSN: host=postgres port=5432 user=openshop password=openshop dbname=openshop sslmode=disable TimeZone=UTC
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: change-me-in-production-please
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/data/uploads
      STORAGE_PUBLIC_URL: http://localhost:8080/uploads
      WORKER_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    # Run several replicas behind a load balancer to prove horizontal scaling:
    #   docker compose up --scale backend=3
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  natsdata:
  uploads:
