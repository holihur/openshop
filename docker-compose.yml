name: openshop

# One image serves the API and both SPAs. Values come from a root .env file
# (generated by install.sh); the defaults allow `docker compose up` to work
# out of the box for local evaluation.
x-backend-image: &backend-image
  image: openshop-backend
  build:
    context: .
    dockerfile: backend/Dockerfile

x-db-env: &db-env
  POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-openshop} password=${POSTGRES_PASSWORD:-openshop} dbname=${POSTGRES_DB:-openshop} sslmode=disable TimeZone=UTC

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openshop}
      POSTGRES_DB: ${POSTGRES_DB:-openshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openshop} -d ${POSTGRES_DB:-openshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    restart: unless-stopped

  migrate:
    <<: *backend-image
    command: ["/app/migrate", "-dir", "/app/migrations"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend-image
    command: ["/app/seed"]
    environment:
      <<: *db-env
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/data/uploads
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:8080/uploads}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["seed"]
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      HTTP_CORS_ORIGINS: "${HTTP_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}"
      POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-openshop} password=${POSTGRES_PASSWORD:-openshop} dbname=${POSTGRES_DB:-openshop} sslmode=disable TimeZone=UTC
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      APP_CURRENCY: ${APP_CURRENCY:-CNY}
      TAX_RATE_BPS: "${TAX_RATE_BPS:-600}"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8080/reset-password}
      EMAIL_VERIFY_URL: ${EMAIL_VERIFY_URL:-http://localhost:8080/verify-email}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/data/uploads
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:8080/uploads}
      WORKER_ENABLED: "true"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Prove horizontal scaling by running several replicas:
    #   docker compose up --scale backend=3
    deploy:
      replicas: 1

  # Operations console + admin API. A separate binary so it can be exposed only
  # on an internal network. It shares the JWT secret and database with the
  # Server-rendered storefront. It renders from the API on the server, so it is
  # reachable even before any JavaScript runs.
  front-ssr:
    build:
      context: .
      dockerfile: front_ssr/Dockerfile
    environment:
      OPENSHOP_API_BASE: http://openshop:8080
    ports: ["3000:3000"]
    depends_on:
      openshop:
        condition: service_healthy
    restart: unless-stopped

  # storefront but runs no background workers.
  ops:
    <<: *backend-image
    command: ["/app/ops"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPS_ADDR: ":8081"
      POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-openshop} password=${POSTGRES_PASSWORD:-openshop} dbname=${POSTGRES_DB:-openshop} sslmode=disable TimeZone=UTC
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      APP_CURRENCY: ${APP_CURRENCY:-CNY}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/data/uploads
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:8080/uploads}
      WORKER_ENABLED: "false"
    ports:
      - "${OPS_PORT:-8081}:8081"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  natsdata:
  uploads:
