# golangci-lint configuration for OpenShop (v2 schema).
# Run locally with: golangci-lint run ./...
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  exclusions:
    rules:
      # Adapters legitimately ignore errors on best-effort cache invalidation.
      - path: internal/adapter
        linters: [errcheck]
      - path: _test\.go
        linters: [errcheck, gosec, unparam]
